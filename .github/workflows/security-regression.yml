name: Security Regression

on:
  push:
    branches:
      - develop
      - stage3/auth-rls-tenant-foundation
  pull_request:

permissions:
  contents: read

jobs:
  api-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Build API
        run: npm --prefix apps/api run build

      - name: Run security regression contracts
        run: npm --prefix apps/api run test:security
