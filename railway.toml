[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build --workspace=@sukuu/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
